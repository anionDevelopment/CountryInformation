[build-system]
requires = ["setuptools >= 74.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "countryinformation"
version = "1.0.13"
authors = [{ name = "Marius Göcke", email = "marius.goecke@gmail.com" }]
description = "CountryInformation is a project to provide certain country- and language-information in a way which is well processable programmatically."
readme = "ReadMe.md"
requires-python = ">=3.10"
keywords = ["package", "release", "build", "management"]
classifiers = [
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Programming Language :: Python :: 3.10",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows :: Windows 10",
    "Topic :: System :: Logging",
    "Topic :: System :: Monitoring",
    "Topic :: System :: Archiving :: Packaging",
    "Topic :: System :: Systems Administration",
    "Topic :: Terminals",
    "Topic :: Utilities",
]
dependencies = [
    "ScriptCollection>=4.2.69",
]

[project.urls]
Homepage = "https://github.com/anionDev/CountryInformation"
Documentation = "https://aniondev.github.io/CountryInformationReference/index.html"
Changelog = "https://github.com/anionDev/CountryInformation/tree/main/Other/Resources/Changelog"

[tool.setuptools]
zip-safe = false
include-package-data = false

[tool.setuptools.packages.find]
where = ["."]
include = ["CountryInformation*"]
exclude = ["CountryInformationTests*"]
